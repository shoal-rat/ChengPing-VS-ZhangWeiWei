<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梗图格斗:陈平 VS 张维为 | MEME FIGHT ARCADE</title>
<meta name="description" content="KOF-style meme arena fighter built from Chinese internet commentator memes. AI-generated art. Parody game.">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #07090f;
    overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap { position: relative; }
  #game {
    background: #0a0e1a;
    box-shadow: 0 0 70px rgba(255, 157, 60, 0.18);
    border-radius: 6px;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 16 / 9;
  }
  #hint {
    position: fixed;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(177, 188, 210, 0.55);
    font-size: 12px;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="hint">本作为梗图恶搞 Parody · 全部立绘由 AI 生成</div>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
